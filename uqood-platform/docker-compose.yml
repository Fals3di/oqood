version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: uqood_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-uqood_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uqood_secure_pass_123}
      POSTGRES_DB: ${DB_NAME:-uqood_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uqood_user} -d ${DB_NAME:-uqood_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching & Queues (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: uqood_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
